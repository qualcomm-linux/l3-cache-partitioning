name: Kernel Module Build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build arm64 kernel module
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install cross-compile toolchain and kernel headers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc-aarch64-linux-gnu make bc libelf-dev flex bison

      - name: Download and prepare minimal kernel headers
        run: |
          KERNEL_VERSION=6.6.30
          wget -q https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-${KERNEL_VERSION}.tar.xz
          tar -xf linux-${KERNEL_VERSION}.tar.xz
          cd linux-${KERNEL_VERSION}
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- defconfig
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- modules_prepare
          echo "KDIR=$(pwd)" >> $GITHUB_ENV

      - name: Build module
        run: |
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- KDIR="$KDIR" W=1 KBUILD_MODPOST_WARN=1

      - name: Verify module was produced
        run: |
          ls -la qcom-cache-partition.ko
          aarch64-linux-gnu-objdump -f qcom-cache-partition.ko
